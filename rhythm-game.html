<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RhythmFlow - Game</title>
<link rel="stylesheet" href="game.css">
</head>
<body>

<!-- ═══════════════ MENU SCREEN ═══════════════ -->
<div class="overlay" id="menu-screen">
  <div class="title-logo">RF</div>
  <p style="color:rgba(0,245,255,0.7); font-family:'Share Tech Mono'; font-size:12px; letter-spacing:3px;">RHYTHM GAME ENGINE v1.0</p>

  <div class="upload-row">
    <label class="btn" for="audio-upload">🎵 Upload Audio</label>
    <input type="file" id="audio-upload" accept="audio/*">
    <label class="btn" for="video-upload">🎬 Upload Video/Image</label>
    <input type="file" id="video-upload" accept="video/*,image/*">
    <label class="btn pink" for="beatmap-upload">🗺️ Load Beatmap</label>
    <input type="file" id="beatmap-upload" accept=".json">
  </div>

  <div class="info-box">
    KEYS: <span style="color:var(--key-d)">D</span> &nbsp;
    <span style="color:var(--key-f)">F</span> &nbsp;
    <span style="color:var(--key-j)">J</span> &nbsp;
    <span style="color:var(--key-k)">K</span><br>
    Tekan tombol saat panah menyentuh zona hit
  </div>

  <!-- Settings row -->
  <div style="display:flex;gap:24px;flex-wrap:wrap;justify-content:center;align-items:center;">
    <div class="setting-row">
      <span>Kecepatan</span>
      <input type="range" id="speed-slider" min="100" max="600" value="280">
      <span id="speed-val">280</span>
    </div>
    <div class="setting-row">
      <span>Offset (ms)</span>
      <input type="range" id="offset-slider" min="-500" max="500" value="0">
      <span id="offset-val">0</span>
    </div>
  </div>

  <div style="display:flex; gap:12px; flex-wrap:wrap; justify-content:center;">
    <button class="btn" id="start-demo-btn">▶ DEMO (tanpa file)</button>
    <button class="btn" id="start-btn" disabled>▶ START GAME</button>
    <a href="beatmap-editor.html" class="btn pink" target="_blank">✏️ BEATMAP EDITOR</a>
  </div>

  <div id="load-status" style="font-family:'Share Tech Mono';font-size:11px;color:rgba(255,255,255,0.3);">Belum ada file dimuat</div>
</div>

<!-- ═══════════════ PAUSE SCREEN ═══════════════ -->
<div class="overlay" id="pause-screen" style="display:none;">
  <h1>PAUSE</h1>
  <div style="display:flex;gap:12px;">
    <button class="btn" id="resume-btn">▶ RESUME</button>
    <button class="btn pink" id="quit-btn">✖ QUIT</button>
  </div>
</div>

<!-- ═══════════════ RESULT SCREEN ═══════════════ -->
<div class="overlay" id="result-screen" style="display:none;">
  <div class="grade" id="result-grade">S</div>
  <h1>COMPLETE</h1>
  <div class="stat-row">
    <div class="stat-box"><div class="val" id="res-score">0</div><div class="lbl">Score</div></div>
    <div class="stat-box"><div class="val" id="res-combo">0</div><div class="lbl">Max Combo</div></div>
    <div class="stat-box"><div class="val" id="res-acc">0%</div><div class="lbl">Accuracy</div></div>
    <div class="stat-box"><div class="val" id="res-perfect">0</div><div class="lbl">Perfect</div></div>
    <div class="stat-box"><div class="val" id="res-good">0</div><div class="lbl">Good</div></div>
    <div class="stat-box"><div class="val" id="res-miss">0</div><div class="lbl">Miss</div></div>
  </div>
  <div style="display:flex;gap:12px;">
    <button class="btn" id="retry-btn">↺ RETRY</button>
    <button class="btn pink" id="menu-btn">⌂ MENU</button>
  </div>
</div>

<!-- ═══════════════ GAME ═══════════════ -->
<div id="app">
  <div id="video-zone">
    <video id="bg-video" loop muted playsinline></video>
    <img id="bg-image" alt="background">
    <div class="scanline"></div>
    <div id="progress-bar" style="width:0%"></div>

    <div id="hud">
      <div id="score-display">000000</div>
      <div id="combo-display"><span id="combo-num">0</span>COMBO</div>
      <div id="accuracy-display">ACC<br><span id="acc-num">100%</span></div>
    </div>

    <div id="health-bar-wrap">
      <div id="health-bar" style="height:100%"></div>
    </div>

    <div id="fc-notice">★ FULL COMBO ★</div>
    <div id="countdown"></div>

    <div id="game-overlay">
      <div id="lanes">
        <div class="lane" data-key="d" id="lane-d">
          <div class="hit-zone"></div>
          <span class="key-label">D</span>
        </div>
        <div class="lane" data-key="f" id="lane-f">
          <div class="hit-zone"></div>
          <span class="key-label">F</span>
        </div>
        <div class="lane" data-key="j" id="lane-j">
          <div class="hit-zone"></div>
          <span class="key-label">J</span>
        </div>
        <div class="lane" data-key="k" id="lane-k">
          <div class="hit-zone"></div>
          <span class="key-label">K</span>
        </div>
      </div>
    </div>
  </div>
</div>

<audio id="audio-player" preload="auto"></audio>

<script src="game.js"></script>
</body>
</html>
